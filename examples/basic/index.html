<!DOCTYPE html>
<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      .view-3d {
        position: relative;
      }

      body,
      html {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }

      .cluster-text-overlay-breadcrumb-item {
        color: white;
      }

      .graph-cluster-caption {
        color: #ffffff;

        padding: 2px 5px;
        text-shadow: 0 0 0.5em black, 0 0 0.5em black, 0 0 0.5em black;

        font-family: "Roboto", sans-serif;
        font-size: 0.8em;
        font-weight: 900;
        opacity: 0.5;
      }

      .graph-cluster-caption:hover {
        opacity: 0.6 !important;
        color: darkslateblue;

        text-shadow: 0 0 0.5em white, 0 0 0.5em white, 0 0 0.5em white;
      }


    </style>
  </head>
  <body>
    <div id="app"></div>
    <graph-searchbar
      placeholder="Search nodes"
      search-fields="name,id,group,industry"
    ></graph-searchbar>
    <script type="module">
      import {
        GraphView3D,
        ClusteringUtils,
        GeneratorDatasource,
        CircleDistribution,
        GridDistribution,
        CircleHullEffect,
        BasicHullEffect,
        ConvexVolume,
        GraphSearchbar,
      } from "cluster-graph-3d";
      import "cluster-graph-3d/dist/index.css";

      const graph = new GraphView3D(document.getElementById("app"), {
        nodeTexture: "assets/dot7.png",
        nodeDefaultScale: 10,
        showEdgeIndicator: true,
        speccs: ClusteringUtils.buildSpeccs([
          {
            key: "group",
            distribution: new CircleDistribution(90000),
            hullOptions: { minClusterSize: 40 },
          },
          {
            key: "industry",
            distribution: new GridDistribution(25000),
            hullOptions: {
              zoomDirection: [0, -1, 0],
              minClusterSize: 15,
              hull: ConvexVolume,
              makeHullEffect: () => new CircleHullEffect(),
              hullBorderMode: "hover",
            },
          },
          {
            distribution: new GridDistribution(8000),
            hullOptions: {
              zoomDirection: [0, -1, 0],
              hull: ConvexVolume,
              makeHullEffect: () => new BasicHullEffect(),
              hullBorderMode: "ambient",
            },
          },
        ]),
      });

      graph.loadDatasource(
        new GeneratorDatasource({
          nodeCount: 5000,
          edgeCount: 2000,
          maxItemsPerNode: 50,
          clusterEdgeBias: 0.9,
        })
      );
      graph.maximise();
    </script>
  </body>
</html>
